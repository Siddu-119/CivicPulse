spring.application.name=CivicPulse

spring.config.import=optional:file:.env[.properties],optional:file:./backend/.env[.properties]

# ==============================================================================
# Database Configuration (MySQL 8 / TiDB Cloud Serverless Compatible)
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/civicpulse?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool (Optimized for TiDB Cloud Serverless & Containerized Free Tiers)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=30000

# JPA, Hibernate & SQL Initialization Settings
spring.sql.init.mode=${SQL_INIT_MODE:never}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT:org.hibernate.dialect.MySQLDialect}

# Server Port (Binds automatically to Render's assigned PORT environment variable)
server.port=${PORT:8080}

# Multipart upload limits (10MB max file)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
app.upload.dir=${UPLOAD_DIR:uploads}

# Environment-driven JWT and bootstrap admin configuration
app.jwt.secret=${JWT_SECRET:civicpulse-development-jwt-secret-key-must-be-at-least-32-bytes-long-for-hmac-sha256}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.admin.email=${ADMIN_EMAIL:admin@civicpulse.gov}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
app.admin.require-secure-password=${REQUIRE_SECURE_ADMIN_PASSWORD:false}

# Sample & Demo Data Seeding Toggle (true for evaluator demo; false for clean production)
app.seed.sample-data=${SEED_SAMPLE_DATA:true}

# CORS Allowed Origins (Comma-separated, supports wildcards like https://*.vercel.app)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://*.vercel.app}
